apiVersion: apps/v1
kind: Deployment
metadata:
  name: kql-simulator
  namespace: kql-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kql-simulator
  template:
    metadata:
      labels:
        app: kql-simulator
    spec:
      containers:
        - name: kql-simulator
          image: ulyssesbunn/kql-simulator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
